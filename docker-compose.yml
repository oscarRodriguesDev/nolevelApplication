version: "3.9"

services:
  evolution-api:
    image: evoapicloud/evolution-api:v2.3.0
    restart: always
    environment:
      SERVER_URL: https://api.seudominio.com
      AUTHENTICATION_TYPE: apikey
      AUTHENTICATION_API_KEY: 123456asdf

      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://evolution:evolution2024@postgres:5432/evolution_api
      DATABASE_CONNECTION_DB_PREFIX_NAME: evo

      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "true"
      DATABASE_SAVE_MESSAGE_UPDATE: "true"

      CACHE_REDIS_ENABLED: "false"

      WEBSOCKET_ENABLED: "true"
      WEBSOCKET_GLOBAL_EVENTS: "true"

      TZ: America/Sao_Paulo
      DOCKER_ENV: "true"

    volumes:
      - evolution_evolution_store:/evolution/store
      - evolution_evolution_instances:/evolution/instances

    depends_on:
      - postgres

    networks:
      - rede_gera

  postgres:
    image: postgres:15
    restart: always
    environment:
      POSTGRES_DB: evolution_api
      POSTGRES_USER: evolution
      POSTGRES_PASSWORD: evolution2024
    volumes:
      - evolution_postgres_data:/var/lib/postgresql/data
    networks:
      - rede_gera

  nolevel-bot:
    build:
      context: ../nolevel
    restart: always
    environment:
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: 123456asdf
      OPENAI_API_KEY: ${OPENAI_API_KEY}
    depends_on:
      - evolution-api
    networks:
      - rede_gera

volumes:
  evolution_evolution_store:
  evolution_evolution_instances:
  evolution_postgres_data:

networks:
  rede_gera:
    external: true